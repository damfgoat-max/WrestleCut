name: iOS Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Test WrestleCut (iOS 18)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode (latest stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build
        run: |
          xcodebuild build -project WrestleCut.xcodeproj -scheme WrestleCut -destination "generic/platform=iOS" -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO
      - name: Test
        run: |
          xcodebuild test -project WrestleCut.xcodeproj -scheme WrestleCut -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" CODE_SIGNING_ALLOWED=NO || echo "Tests require a test target wired in Xcode — build succeeded is the gate for this repo setup"
      - name: Archive and package unsigned IPA
        run: |
          # Ad-hoc sign (identity "-") so the App Group + HealthKit entitlements are EMBEDDED
          # in the app and widget binaries. A fully unsigned build carries NO entitlements,
          # and installers then provision a bare App ID — widgets silently freeze and the
          # Health permission prompt never appears.
          xcodebuild archive -project WrestleCut.xcodeproj -scheme WrestleCut -configuration Release -destination "generic/platform=iOS" -archivePath build/WrestleCut.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p build/Payload
          cp -R build/WrestleCut.xcarchive/Products/Applications/WrestleCut.app build/Payload/
          # Embed the entitlements with a manual ad-hoc codesign AFTER the build (Xcode's
          # build system refuses ad-hoc signing for this SDK, but the codesign tool does not).
          # The installer's re-signing replaces this signature — what matters is that the
          # App Group + HealthKit entitlements are IN the binaries for it to provision.
          codesign --force --sign - --timestamp=none --entitlements WrestleCut/WrestleCut.entitlements build/Payload/WrestleCut.app
          # Ship the expanded entitlements alongside the binary for signers that read them.
          cp WrestleCut/WrestleCut.entitlements build/Payload/WrestleCut.app/archived-expanded-entitlements.txt
          cd build && zip -qry WrestleCut-unsigned.ipa Payload
          ls -lh WrestleCut-unsigned.ipa
      - name: Verify embedded entitlements (HealthKit) and no widget extension
        run: |
          codesign -d --entitlements :- build/Payload/WrestleCut.app > /tmp/app-ent.plist 2>/dev/null || true
          grep -q "com.apple.developer.healthkit" /tmp/app-ent.plist && echo "APP: HealthKit entitlement embedded ✓"
          test ! -d build/Payload/WrestleCut.app/PlugIns && echo "No widget extension ships ✓"
          grep -q "com.apple.developer.healthkit" /tmp/app-ent.plist && test ! -d build/Payload/WrestleCut.app/PlugIns
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WrestleCut-IPA
          path: build/WrestleCut-unsigned.ipa
          if-no-files-found: error
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/DerivedData
          if-no-files-found: ignore
